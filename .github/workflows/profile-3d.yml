name: Profile-3D-and-Stats

on:
  schedule:
    - cron: "0 * * * *"    # every hour
  push:
    branches: [main]
  workflow_dispatch:        # run manually from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate 3D graph + live stats
    steps:
      - uses: actions/checkout@v4

      - name: Generate 3D contribution graph
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: Swastik1901
        run: python3 scripts/generate_3d.py

      - name: Generate live stats card
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: Swastik1901
        run: python3 scripts/generate_stats.py

            - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh 3D graph and stats" || exit 0
          git push
